[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-os"
version = "0.1.0"
description = "Deterministic agent-neutral memory governance"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memory = "cli.__main__:main"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "adapters*"]
