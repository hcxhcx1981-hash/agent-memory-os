name: offline-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: windows-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; MIT
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0; MIT
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release-security-check.py --history
      - run: python -m unittest discover -v
      - run: python -m cli --help
      - run: python examples/demo.py --quickstart-only
      - run: python examples/demo.py
      - run: git diff --check
      - run: python -c "import subprocess; assert not subprocess.check_output(['git', 'status', '--porcelain']).strip()"
